# Publishes the public website (viewer site at / and the app download page at /download/).
#
# Where it goes:
#   - Cloudflare, when the repository has the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#     (recommended, for your own domain such as voyagercommand.com; see PUBLISHING.md)
#   - otherwise GitHub Pages (https://<owner>.github.io/<repo>/)
#
# Live giveaway data is NOT built here: the Voyager app uploads it to the public-data branch
# while you stream, and the site reads it from there.
name: Public website
on:
  push:
    branches: [main, master]
    paths: ['site/**', 'brand-assets/**', '.github/workflows/public-site.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: public-website
  cancel-in-progress: false
jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.pick.outputs.cloudflare }}
    steps:
      - id: pick
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          # Reports which settings are present (never their values) so a misplaced one is easy to spot.
          state(){ if [ -n "$1" ]; then echo found; else echo missing; fi; }
          echo "::notice title=Cloudflare settings::CLOUDFLARE_API_TOKEN secret: $(state "$TOKEN"). CLOUDFLARE_ACCOUNT_ID secret: $(state "$ACCOUNT_SECRET"), variable: $(state "$ACCOUNT_VAR")."
          if [ -n "$TOKEN_VAR" ]; then echo "::warning title=Token saved as a variable::CLOUDFLARE_API_TOKEN is saved under Variables, where anyone can read it. Delete it there and add it under Secrets instead."; fi
          if [ -n "$TOKEN" ] && { [ -n "$ACCOUNT_SECRET" ] || [ -n "$ACCOUNT_VAR" ]; }; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"; echo "Publishing to Cloudflare"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"; echo "Publishing to GitHub Pages"
          fi

  cloudflare:
    needs: target
    if: needs.target.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the website
        run: node site/build-site.mjs "${{ github.repository }}" _site
      - name: Add Cloudflare settings and security headers
        env:
          VOYAGER_EMBED_ORIGINS: ${{ vars.VOYAGER_EMBED_ORIGINS }}
        run: node site/cloudflare.mjs _site
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            # Put Cloudflare's own error message on the run summary (the token is never printed by wrangler).
            node -e "const t=require('fs').readFileSync('deploy.log','utf8').replace(/\x1b\[[0-9;]*m/g,'').split('\n').filter(l=>/error|✘|failed|denied|authenticat|permission|subdomain|account|code: ?\d+/i.test(l)).slice(-12).join('\n')||'See the log';console.log('::error title=Cloudflare deploy failed::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
            exit 1
          fi

  github-pages:
    needs: target
    if: needs.target.outputs.cloudflare != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build-site.mjs "${{ github.repository }}" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
