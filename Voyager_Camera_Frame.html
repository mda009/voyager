<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyager • Camera frame</title>
<link rel="icon" href="brand-assets/voyager.png" type="image/png">
<style>
/* Camera spotlight frame (2.20.52). A transparent OBS Browser Source placed exactly over the second camera (same position
   and size). It draws the glass border with a light running around it and fades in and out with the camera for the length
   of each support alert (Voyager - Fleet Alerts queue, plus the hold set on Support alerts › Camera spotlight).
   Source address options: ?radius=48 (corner radius, px)  ?border=6 (px)  ?accent=blue (default: blue · silver · white) | gold | white  ?speed=6 (seconds per lap)
   ?preview=1 (always shown)  ?glow=0 (no outer glow)  ?static=1 (no running light)  ?voyager=port (only when not opened from the Voyager host) */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#frame{position:absolute;inset:0;border-radius:var(--r,48px);opacity:0;transition:opacity .45s ease;pointer-events:none;
  /* default (2.20.54): blue into silver into white, like the card's silver and blue tiers */
  --accent:#5fb0ff;--accent2:#ffffff;--silver:#cfd8e2;--accent-soft:rgba(95,176,255,.3);--accent-mark:rgba(151,223,255,.75)}
#frame.gold{--accent:#ffd36a;--accent2:#fff3b8;--silver:#ffe07a;--accent-soft:rgba(255,211,106,.35);--accent-mark:rgba(255,211,106,.7)}#frame.white{--accent:#ffffff;--accent2:#dbe9f5;--silver:#ffffff;--accent-soft:rgba(255,255,255,.35);--accent-mark:rgba(255,255,255,.7)}
#frame.on{opacity:1}
/* glass stroke: a translucent light edge with a soft outer shadow, like the card and goal tiles */
#frame .glass{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--b,6px) rgba(255,255,255,.26),inset 0 1px 0 rgba(255,255,255,.4),0 18px 40px rgba(0,0,0,.45)}
#frame.noglow .glass{box-shadow:inset 0 0 0 var(--b,6px) rgba(255,255,255,.26),inset 0 1px 0 rgba(255,255,255,.4)}
/* running light: a conic gradient ring, cut to the border width with a mask */
#frame .light{position:absolute;inset:0;border-radius:inherit;padding:var(--b,6px);
  background:conic-gradient(from var(--a),transparent 0deg,transparent 235deg,var(--accent-soft) 285deg,var(--accent) 320deg,var(--silver) 342deg,var(--accent2) 354deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:lap var(--speed,6s) linear infinite;filter:drop-shadow(0 0 6px var(--accent))}
#frame.static .light{animation:none;background:linear-gradient(135deg,var(--accent-soft),transparent 60%)}
@keyframes lap{to{--a:360deg}}
/* faint corner marks in the brand's cut-corner language */
#frame .mark{position:absolute;width:30px;height:30px;border:3px solid var(--accent-mark);opacity:.9}
#frame .tl{left:14px;top:14px;border-right:0;border-bottom:0;border-top-left-radius:6px}#frame .tr{right:14px;top:14px;border-left:0;border-bottom:0;border-top-right-radius:6px}
#frame .bl{left:14px;bottom:14px;border-right:0;border-top:0;border-bottom-left-radius:6px}#frame .br{right:14px;bottom:14px;border-left:0;border-top:0;border-bottom-right-radius:6px}
@media(prefers-reduced-motion:reduce){#frame .light{animation:none}}
</style></head>
<body><div id="frame"><div class="glass"></div><div class="light"></div><i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i></div>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),frame=document.getElementById('frame');
const num=(k,d,min,max)=>{const n=Number(q.get(k));return q.has(k)&&Number.isFinite(n)?Math.max(min,Math.min(max,n)):d;};
frame.style.setProperty('--r',num('radius',48,0,400)+'px');frame.style.setProperty('--b',num('border',6,1,24)+'px');frame.style.setProperty('--speed',num('speed',6,1,60)+'s');
if(['gold','white'].includes(q.get('accent')))frame.classList.add(q.get('accent'));if(q.get('glow')==='0')frame.classList.add('noglow');if(q.get('static')==='1')frame.classList.add('static');
const preview=q.get('preview')==='1';if(preview){frame.classList.add('on');return;}
// 2.20.55: no Streamer.bot connection needed. The frame reads the alert queue and camera state from the Voyager host
// (same-origin when opened from the host, otherwise http://127.0.0.1:8740 or ?voyager=port), so it works from any browser source.
const hosted=location.protocol==='http:'&&/^(127\.0\.0\.1|localhost)$/.test(location.hostname),base=hosted?'':'http://127.0.0.1:'+(Number(q.get('voyager'))||8740);
let state=null,offset=0,lastOk=0;
function tick(){
 const now=Date.now()+offset,c=state?.camera;
 if(!state||!state.enabled||!c?.enabled||Date.now()-lastOk>20000){frame.classList.remove('on');return;}
 const hold=Math.max(0,Math.min(30,Number(c.hold)||0))*1000;
 const alert=(state.queue||[]).some(e=>e.startAt<=now&&now<e.endAt+hold),last=state.cameraLast;
 const manual=!!last&&last.visible===true&&!last.error; // Show now on the Support alerts page, or the camera still up
 frame.classList.toggle('on',alert||manual);
}
async function poll(){try{const r=await fetch(base+'/api/fleet/overlay',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();lastOk=Date.now();offset=(Number(d.serverAt)||Date.now())-Date.now();state=d.state;}catch{}tick();}
poll();setInterval(poll,1000);setInterval(tick,250);
})();
</script>
</body></html>
