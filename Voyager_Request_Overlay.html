<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyager • OBS Viewer Request Alert</title><link rel="icon" href="brand-assets/voyager.png">
<style>
/* Voyager viewer request alert: an OBS browser source, 1920 × 1080, transparent.
   2.30.0 animation: a paper plane flies in across the screen on a dotted trail, bursts into gold sparks at the top centre and
   the glass card pops out of the burst — who asked, what for, how many are asking — with a shine sweep and a count badge.
   A short chime plays when "Play a chime" is on. ?preview=1 loops a sample (used by nothing in Voyager; handy for placing it). */
@font-face{font-family:Rajdhani;src:url(brand-assets/Rajdhani-700.ttf);font-weight:700}@font-face{font-family:Rajdhani;src:url(brand-assets/Rajdhani-600.ttf);font-weight:600}
html,body{margin:0;background:transparent;height:100%;overflow:hidden;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#eef4fb}
#stage{position:absolute;inset:0;pointer-events:none}
/* the plane */
#plane{position:absolute;left:0;top:0;width:86px;height:86px;opacity:0;color:#ffd56a;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,213,106,.55));will-change:transform}
#plane svg{width:100%;height:100%}
.go #plane{animation:fly 1.25s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-140px,620px) rotate(-38deg) scale(.7)}8%{opacity:1}
  35%{transform:translate(420px,300px) rotate(-30deg) scale(1)}60%{transform:translate(700px,330px) rotate(-8deg) scale(1.05)}
  86%{opacity:1;transform:translate(905px,120px) rotate(-52deg) scale(.95)}100%{opacity:0;transform:translate(917px,92px) rotate(-52deg) scale(.3)}}
#trail{position:absolute;inset:0;width:100%;height:100%}
#trail path{fill:none;stroke:#ffd56a;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 16;opacity:0}
.go #trail path{animation:trail 1.7s ease-out forwards}
@keyframes trail{0%{opacity:0;stroke-dashoffset:0}15%{opacity:.75}70%{opacity:.5}100%{opacity:0;stroke-dashoffset:-120}}
/* the burst */
#burst{position:absolute;left:960px;top:132px;width:0;height:0}
#burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#ffd56a;opacity:0;box-shadow:0 0 12px #ffd56a}
#burst i:nth-child(3n){background:#97dfff;box-shadow:0 0 12px #97dfff;width:7px;height:7px}#burst i:nth-child(4n){background:#fff;width:6px;height:6px}
.go #burst i{animation:spark .9s cubic-bezier(.1,.7,.3,1) 1.12s forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1.3)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
#ring{position:absolute;left:960px;top:132px;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid #ffd56a;opacity:0}
.go #ring{animation:ring .8s ease-out 1.12s forwards}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(9)}}
/* the card */
#card{position:absolute;left:50%;top:70px;transform:translate(-50%,0) scale(.2);opacity:0;min-width:560px;max-width:940px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 24px 20px 20px;border-radius:14px;overflow:hidden;
  background:linear-gradient(135deg,rgba(9,17,31,.9),rgba(14,28,46,.84) 60%,rgba(10,20,36,.9));border:1px solid rgba(255,213,106,.45);border-top:3px solid #ffd56a;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 46px rgba(0,0,0,.5),0 0 34px rgba(255,213,106,.18);text-shadow:0 1px 3px #0009}
.go #card{animation:pop .7s cubic-bezier(.2,1.5,.35,1) 1.15s forwards}
.out #card{animation:leave .5s cubic-bezier(.6,0,.8,.3) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,40px) scale(.2)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes leave{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-150px) scale(.9)}}
#card::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);opacity:0}
.go #card::after{animation:shine 1.1s ease-out 1.75s forwards}
@keyframes shine{0%{opacity:1;left:-40%}100%{opacity:0;left:120%}}
#icon{width:66px;height:66px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,213,106,.14);border:1px solid rgba(255,213,106,.4);color:#ffd56a}
#icon svg{width:38px;height:38px}
.go #icon svg{animation:wiggle 1.6s ease-in-out 1.8s 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}75%{transform:rotate(0)}}
small{display:block;font:700 13px/1 Rajdhani,'Segoe UI',sans-serif;letter-spacing:.26em;color:#ffd56a;text-transform:uppercase}
b{display:block;font:700 34px/1.1 Rajdhani,'Segoe UI',sans-serif;letter-spacing:.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
b span{color:#ffd56a}
em{display:block;font:500 15px/1.3 Inter,'Segoe UI',sans-serif;font-style:normal;color:#a9bfd4;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{min-width:74px;text-align:center;padding:8px 10px;border-radius:12px;background:rgba(255,213,106,.12);border:1px solid rgba(255,213,106,.35);transform:scale(0)}
#count strong{display:block;font:700 34px/1 Rajdhani,'Segoe UI',sans-serif;color:#ffd56a;font-variant-numeric:tabular-nums}
#count span{display:block;font:700 10px/1 Rajdhani,'Segoe UI',sans-serif;letter-spacing:.2em;color:#a9bfd4;margin-top:4px}
.go #count{animation:badge .5s cubic-bezier(.2,1.8,.4,1) 2s forwards}
@keyframes badge{to{transform:scale(1)}}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#ffd56a;width:100%;transform-origin:left;transform:scaleX(var(--p,1))}
@media(prefers-reduced-motion:reduce){.go #plane,.go #trail path,.go #burst i,.go #ring{animation:none}.go #card{animation:pop .01s forwards}.go #count{animation:badge .01s forwards}}
</style></head>
<body><div id="stage">
<svg id="trail" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"><path d="M-60 660 C 300 420, 560 300, 740 372 S 900 260, 960 136"/></svg>
<div id="plane" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="#0a1422" stroke-width=".6" stroke-linejoin="round"><path d="M22 2 2 10.5l7 2.6L22 2z"/><path d="M22 2 9 13.1V21l3.6-5.2L18 19 22 2z" opacity=".82"/></svg></div>
<div id="ring" aria-hidden="true"></div><div id="burst" aria-hidden="true"></div>
<div id="card" role="status"><div id="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></div>
<div><small>Viewer request</small><b id="line"></b><em id="sub"></em></div><div id="count"><strong id="n">1</strong><span>ASKING</span></div><i id="bar"></i></div>
</div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),preview=new URLSearchParams(location.search).has('preview');let shown=0,alert=null,offset=0,audio=null;
const burst=$('burst');for(let i=0;i<22;i++){const s=document.createElement('i'),a=i/22*Math.PI*2,d=120+((i*53)%140);s.style.setProperty('--x',Math.round(Math.cos(a)*d)+'px');s.style.setProperty('--y',Math.round(Math.sin(a)*d*.7)+'px');burst.append(s);}
// A whoosh-free, friendly three-note chime, timed to the burst.
function chime(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t0=audio.currentTime+1.12;[[784,0],[1047,.11],[1319,.22]].forEach(([f,d])=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.16,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.7);o.connect(g).connect(audio.destination);o.start(t0+d);o.stop(t0+d+.75);});}catch{}}
function show(a,sound){alert=a;if(a.id!==shown){shown=a.id;const line=$('line');line.textContent='';line.append(document.createTextNode(a.name+' asks for '));const s=document.createElement('span');s.textContent=a.label;line.append(s);
    $('n').textContent=String(a.count||1);stage.classList.remove('go','out');void stage.offsetWidth;stage.classList.add('go');if(sound)chime();}}
function hide(){if(stage.classList.contains('go')){stage.classList.remove('go');stage.classList.add('out');}alert=null;}
function frame(){if(alert){const now=Date.now()+offset,p=Math.max(0,Math.min(1,(alert.until-now)/(alert.until-alert.at)));$('bar').style.setProperty('--p',p);if(now>=alert.until)hide();}requestAnimationFrame(frame);}
async function poll(){try{const d=await(await fetch('/api/requests/overlay',{cache:'no-store'})).json();offset=d.serverAt-Date.now();
    if(d.enabled&&d.alert){show(d.alert,d.sound);$('sub').textContent=(d.tally||[]).map(t=>t.label+' ×'+t.count).join('  ·  ')+(d.waiting?'  ·  +'+d.waiting+' more waiting':'')||(d.alert.test?'Test alert':'');}
    else if(!d.alert&&alert)hide();}catch{}setTimeout(poll,1500);}
if(preview){let n=0;const demo=()=>{const now=Date.now();offset=0;show({id:++n,name:'Sample Viewer',label:['Bridge Quiz','Dreadnought','Marbles'][n%3],count:n,at:now,until:now+9000},true);$('sub').textContent='Bridge Quiz ×2  ·  Dreadnought ×1';};demo();setInterval(demo,11000);}else poll();
requestAnimationFrame(frame);})();
</script></body></html>
