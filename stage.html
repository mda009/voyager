<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyager • Dreadnought stage</title>
<link rel="icon" href="brand-assets/voyager.png" type="image/png">
<link rel="stylesheet" href="stage.css?v=2.20.84">
</head>
<!-- One full-screen OBS browser source (1920 x 1080) that is transparent until the Dreadnought is called. Then: the Dreadnought
     scene in the middle, the panels you chose in the slots around it, your own scene shrunk into the picture-in-picture window
     (Streamer.bot moves it; this page leaves that window see-through). Layout and slots: Voyager Control › Voyager Dreadnought › Stage.
     ?debug=1 shows what the host answered; ?voyager=port when not opened from the host. -->
<body><div id="stage">
<div id="backdrop"></div>
<div id="flash"></div>
<div class="slot col" id="slot-left"></div>
<div class="slot col" id="slot-right"></div>
<div class="slot" id="slot-bottomLeft"></div>
<div id="stack"></div>
<div id="main"><iframe id="dread" title="Dreadnought" allow="autoplay"></iframe></div>
<div class="tag" id="main-tag"><i></i>VOYAGER DREADNOUGHT · LIVE</div>
<div id="pip"><div class="tag" id="pip-tag"><i></i>LIVE · YOUR SCENE</div></div>
<div id="alert"><span>⚠ INCOMING CAPITAL SHIP</span><b>DREADNOUGHT CALLED</b><em><i>!JOIN</i><i>!FIRE</i></em></div>
<div id="debug" hidden></div>
</div>
<script src="stage.js?v=2.20.84"></script>
</body></html>
