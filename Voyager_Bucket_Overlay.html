<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voyager • Giveaway goals HD</title>
  <meta name="voyager-overlay-version" content="goals-hd-1">
  <link rel="stylesheet" href="voyager-brand.css">
  <link rel="stylesheet" href="bucket-overlay.css?v=goals-hd-1"><link rel="icon" href="brand-assets/voyager.png" type="image/png"></head>
<body class="voyager-onair bucket-hd">
  <main class="goal-strip" id="goal-strip" aria-label="Voyager giveaway goals">
    <header class="strip-heading">
      <span class="brand"><img class="logo-voyager strip-voyager" src="brand-assets/voyager.png" alt="Voyager membership program" width="68" height="68">VOYAGER <span class="brand-divider">/</span> <span id="strip-title">GIVEAWAY GOALS</span></span>
      <span class="strip-logos" aria-label="MDA009 and The Unprofessionals"><span class="brand-image brand-image-mda "><img src="brand-assets/mda009.png" alt="MDA009"></span><span class="brand-image brand-image-upr "><img src="brand-assets/unprofessionals.png" alt="The Unprofessionals"></span></span><span class="feed-status" id="feed-status" role="status" data-state="waiting"><i aria-hidden="true"></i><span>CONNECTING</span></span>
    </header>
    <div class="goals" id="goals">
      <section class="goal silver" data-tier="silver" aria-labelledby="silver-label">
        <div class="goal-heading"><h1 id="silver-label">SILVER</h1><span class="percentage">—</span></div>
        <div class="track" role="progressbar" aria-label="Silver giveaway goal" aria-valuemin="0" aria-valuemax="100"><i class="fill"></i></div>
        <div class="goal-detail"><span class="balance">Waiting for points</span><span class="goal-note"></span></div>
      </section>
      <section class="goal gold" data-tier="gold" aria-labelledby="gold-label">
        <div class="goal-heading"><h1 id="gold-label">GOLD</h1><span class="percentage">—</span></div>
        <div class="track" role="progressbar" aria-label="Gold giveaway goal" aria-valuemin="0" aria-valuemax="100"><i class="fill"></i></div>
        <div class="goal-detail"><span class="balance">Waiting for points</span><span class="goal-note"></span></div>
      </section>
      <section class="goal platinum" data-tier="platinum" aria-labelledby="platinum-label">
        <div class="goal-heading"><h1 id="platinum-label">PLATINUM</h1><span class="percentage">—</span></div>
        <div class="track" role="progressbar" aria-label="Platinum giveaway goal" aria-valuemin="0" aria-valuemax="100"><i class="fill"></i></div>
        <div class="goal-detail"><span class="balance">Waiting for points</span><span class="goal-note"></span></div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="giveaway-connection.js"></script>
  <script src="points-model.js"></script>
  <script src="points-connection.js"></script>
  <script src="bucket-overlay-model.js"></script>
  <script src="bucket-overlay.js?v=goals-hd-1"></script>
</body>
</html>
