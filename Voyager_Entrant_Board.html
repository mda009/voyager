<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyager • Detailed entrant board</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080e19;color:#b8cbdf;font:14px 'Segoe UI',Arial,sans-serif}body{display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:16px 26px;border-bottom:1px solid #24354a}header strong{color:#e3f1ff}a{color:#add8ff}iframe{border:0;flex:1;width:100%;min-height:0;background:transparent}#idle{position:absolute;top:45%;left:15%;right:15%;text-align:center}body.preview header{display:none}</style><link rel="stylesheet" href="voyager-brand.css"><link rel="icon" href="brand-assets/voyager.png" type="image/png"></head><body class="voyager-console entrant-monitor"><div class="identity-bar" aria-label="Voyager Control, MDA009 and The Unprofessionals"><div class="identity-primary"><img class="logo-voyager " src="brand-assets/voyager.png" alt="Voyager membership program" width="68" height="68"><div class="identity-copy"><span class="identity-kicker">EXPLORE · EARN · EXCEL</span><strong>VOYAGER CONTROL</strong><small>MDA009 / COMMUNITY OPERATIONS</small></div></div><div class="identity-partners"><figure class="identity-partner"><span class="brand-image brand-image-mda "><img src="brand-assets/mda009.png" alt="MDA009"></span><figcaption>MDA009</figcaption></figure><figure class="identity-partner"><span class="brand-image brand-image-upr "><img src="brand-assets/unprofessionals.png" alt="The Unprofessionals"></span><figcaption>THE UNPROFESSIONALS</figcaption></figure></div></div><header><span><strong>DETAILED ENTRANT BOARD</strong> · <span id="connection">Connecting…</span></span><a href="Giveaway_Control.html" target="_blank">Open control →</a></header><p id="idle">Open an impromptu giveaway to see its entrants here.</p><iframe id="board" src="Voyager_Chat_Entrants.html" title="Detailed ticket board"></iframe><script src="config.js"></script><script src="giveaway-connection.js"></script><script>
(()=>{'use strict';const frame=document.getElementById('board'),preview=new URLSearchParams(location.search).get('preview')==='1';let state=null;
function show(next){if(next){if(state?.revision!=null&&next.revision!=null&&next.revision<state.revision)return;state=next;}const chat=state?.session?.mode==='chat';document.getElementById('idle').hidden=chat;frame.hidden=!chat;if(chat)frame.contentWindow.postMessage({type:'voyager.chat.pool.v1',session:state.session},'*');}
frame.addEventListener('load',()=>show());if(preview){document.body.classList.add('preview');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='voyager.preview.state')show(e.data.state);});parent.postMessage({type:'voyager.preview.ready'},'*');}
else{const connection=new VoyagerConnection();connection.addEventListener('status',e=>{document.getElementById('connection').textContent=e.detail.message;});connection.addEventListener('state',e=>{if(e.detail.ok&&e.detail.state)show(e.detail.state);});connection.connect();}show();
})();
</script></body></html>
