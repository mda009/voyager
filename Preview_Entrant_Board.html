<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyager • Entrant board preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 20%,#183b51,#080e19 65%);color:#e2f1ff;font:14px/1.5 'Segoe UI',Arial,sans-serif}header{padding:18px 4%;display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid #304052}header strong{letter-spacing:2px}header span{color:#9cb2c9;font-size:12px}a{color:#a8d9ff}.screen{width:min(100%,1600px);margin:auto;aspect-ratio:16/9;position:relative}.screen iframe{display:block;border:0;width:100%;height:100%;background:transparent}.controls{max-width:1440px;margin:0 auto;padding:0 25px 28px;display:flex;gap:24px}.buttons{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}button{font:inherit;border:1px solid #46627a;background:#1c3348;color:#e2f1ff;padding:10px 16px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#a6cfff;color:#10253b;border-color:#a6cfff}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#345771}.buttons small{width:100%;color:#91aec8}.log{flex:1;min-width:300px;background:#08121e;border:1px solid #30445b;padding:15px;border-radius:10px}.log strong{font-size:10px;letter-spacing:2px;color:#92b4cf}.log p{margin:9px 0;font-size:12px;color:#b8cddd}.log b{color:#e2f1ff}#feedback{color:#a7dfc7;font-size:12px;min-height:18px}@media(max-width:700px){.controls{flex-direction:column}.log{min-width:0}header{align-items:flex-start;flex-direction:column;gap:4px}}</style></head><body><header><div><strong>VOYAGER / ENTRANT OVERLAY PREVIEW</strong><br><span>Demo names and simulated replies. No connection to your live chats.</span></div><a href="Preview_Giveaway.html">Open full control demo →</a></header><div class="screen"><iframe id="board" src="Voyager_Giveaway_Overlay.html?preview=1" title="Live entrant board demo"></iframe></div><div class="controls"><div class="buttons"><button id="view-panel" aria-pressed="true">Compact OBS panel</button><button id="view-board" aria-pressed="false">Detailed board</button><button data-platform="twitch">+ Twitch entrant</button><button data-platform="youtube">+ YouTube entrant</button><button data-platform="kick">+ Kick entrant</button><button id="repeat">Repeat !enter</button><button id="close">Close entries</button><button id="draw">Draw winner</button><button id="reset">Reset demo</button><small>Names scroll in entry order. Switch views to compare the compact overlay and detailed board.</small><div id="feedback"></div></div><section class="log"><strong>SIMULATED PLATFORM CHAT</strong><div id="chat-log"></div></section></div><script src="giveaway-connection.js"></script><script src="giveaway-demo.js"></script><script>
(()=>{'use strict';const engine=new VoyagerDemo(),$=id=>document.getElementById(id),names={twitch:'Twitch',youtube:'YouTube',kick:'Kick'},pilots=['NovaPilot','OrbitRunner','StarVoyager','AuroraFox','CometRider','NebulaKnight','CosmicWanderer','SolarSentinel','StellarEcho','LunarRanger','QuantumScout','ZenithCaptain','AetherPilot','PolarisPatch','RiftRunner','KeplerOne','IgnitionFox','JunoSkies','QuasarQuinn','HeliosJade','CorvusRider','EchoVanguard','FrostNomad','DriftCaptain'];let last=null,counter=0,ready=false;
function show(){if(!ready)return;$('board').contentWindow.postMessage({type:'voyager.preview.state',state:engine.state,offset:0},'*');const open=engine.state.session?.entriesOpen;document.querySelectorAll('[data-platform],#repeat').forEach(b=>b.disabled=!open);const drawn=!!engine.state.session?.draws.length,building=!!engine.state.reveal&&Date.now()<engine.state.reveal.at+20000;$('close').textContent=open?'Close entries':'Reopen entries';$('close').disabled=drawn||building;$('draw').disabled=open||drawn||!engine.state.session?.pool.length||building;$('reset').disabled=building;}
engine.addEventListener('state',show);engine.addEventListener('chat-confirmation',e=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=names[e.detail.platform]+': ';p.append(b,document.createTextNode(e.detail.text));$('chat-log').prepend(p);while($('chat-log').children.length>4)$('chat-log').lastElementChild.remove();});
addEventListener('message',e=>{if(e.source===$('board').contentWindow&&e.data?.type==='voyager.preview.ready'){ready=true;show();}});
function add(platform){counter++;last={platform,id:'preview-'+counter,name:pilots[(counter-1)%pilots.length]+(counter>pilots.length?Math.ceil(counter/pilots.length):''),login:'pilot'+counter,command:counter%2?'!ticket':'!enter'};engine.enter(last);$('feedback').textContent='';}
async function reset(){await engine.command('new',{controlRevision:engine.state.controlRevision});await engine.command('create',{controlRevision:engine.state.controlRevision,mode:'chat',title:'A surprise for the crew.',claimSeconds:0});counter=0;for(let i=0;i<18;i++)add(['twitch','youtube','kick'][i%3]);$('chat-log').replaceChildren();$('feedback').textContent='18 sample entrants loaded. Add another viewer to try it.';}
for(const b of document.querySelectorAll('[data-platform]'))b.onclick=()=>add(b.dataset.platform);$('repeat').onclick=()=>{if(last){engine.enter({...last,command:'!enter'});$('feedback').textContent='Already entered: the same ticket is kept, with no extra confirmation.';}};$('close').onclick=async()=>{await engine.command(engine.state.session.entriesOpen?'closeEntries':'reopenEntries',{controlRevision:engine.state.controlRevision});$('feedback').textContent=engine.state.session.entriesOpen?'Entries reopened. Existing tickets are kept.':'Entries closed. New commands cannot enter.';};$('reset').onclick=reset;$('draw').onclick=()=>engine.command('draw',{controlRevision:engine.state.controlRevision});function view(detail){ready=false;$('board').src=(detail?'Voyager_Entrant_Board.html':'Voyager_Giveaway_Overlay.html')+'?preview=1';$('view-panel').setAttribute('aria-pressed',String(!detail));$('view-board').setAttribute('aria-pressed',String(detail));} $('view-panel').onclick=()=>view(false);$('view-board').onclick=()=>view(true);setInterval(show,1000);if(new URLSearchParams(location.search).get('view')==='detailed')view(true);reset();
})();
</script></body></html>
