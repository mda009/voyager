<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyager • OBS Raffle Animations</title><link rel="icon" href="brand-assets/voyager.png">
<style>
/* Voyager raffle animations (2.34.0): an OBS browser source, 1920 × 1080, transparent. Invisible until a raffle starts.
   1 · Opening: a gold ticket swings in with RAFFLE, how long it is open and the command.
   2 · While it is open: each new entry gets a ticket stub with their name and number ("you're in"), stacked bottom left.
       The last ten seconds count down at the top.
   3 · The draw: a four-digit drum spins and locks digit by digit on each winning ticket, then the winner's name bursts out;
       winners so far are lined up underneath. Finally all winners are shown together.
   ?preview=1 loops a sample (for placing the source). */
@font-face{font-family:Rajdhani;src:url(brand-assets/Rajdhani-700.ttf);font-weight:700}@font-face{font-family:Rajdhani;src:url(brand-assets/Rajdhani-600.ttf);font-weight:600}
:root{--gold:#ffd56a;--cyan:#a7d8ff;--ink:#eef4fb;--mute:#93a9bf;--d:Rajdhani,'Segoe UI',sans-serif;--t:Inter,'Segoe UI',Arial,sans-serif}
html,body{margin:0;background:transparent;height:100%;overflow:hidden;font-family:var(--t);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
.glass{background:linear-gradient(135deg,rgba(9,17,31,.9),rgba(14,28,46,.84) 60%,rgba(10,20,36,.9));border:1px solid rgba(255,213,106,.4);border-top:3px solid var(--gold);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 60px rgba(0,0,0,.55),0 0 40px rgba(255,213,106,.16);text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* the ticket shape */
.ticket{position:relative;color:#1b1405;text-shadow:none;background:linear-gradient(180deg,#fff0bd 0%,#ffd56a 38%,#e9ac2b 100%);border-radius:14px;
  -webkit-mask:radial-gradient(circle 18px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 18px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 18px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 18px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat}
.ticket::after{content:'';position:absolute;top:10px;bottom:10px;left:var(--perf,74%);border-left:3px dashed rgba(27,20,5,.35)}
/* 1 · opening */
#intro{position:absolute;left:50%;top:300px;width:1040px;height:330px;margin-left:-520px;opacity:0;transform:translateY(-560px) rotate(-14deg);filter:drop-shadow(0 26px 50px rgba(0,0,0,.6))}
#intro.go{animation:swing 6.6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes swing{0%{opacity:0;transform:translateY(-560px) rotate(-14deg)}9%{opacity:1;transform:translateY(0) rotate(5deg)}15%{transform:translateY(0) rotate(-3deg)}21%{transform:rotate(1.5deg)}27%,84%{opacity:1;transform:rotate(0) scale(1)}100%{opacity:0;transform:translate(-640px,-360px) rotate(-10deg) scale(.28)}}
#intro .ticket{position:absolute;inset:0;display:grid;grid-template-columns:74% 26%;--perf:74%}
#intro .l{padding:34px 30px 30px 64px;display:flex;flex-direction:column;justify-content:center}
#intro small{font:700 24px/1 var(--d);letter-spacing:.34em}
#intro h1{font:700 150px/.9 var(--d);letter-spacing:.04em;margin:6px 0 10px}
#intro p{margin:0;font:700 34px/1.15 var(--d);letter-spacing:.03em}
#intro p b{background:#1b1405;color:var(--gold);padding:2px 14px;border-radius:8px}
#intro .r{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-right:44px}
#intro .r i{font:700 20px/1 var(--d);letter-spacing:.24em;font-style:normal}
#intro .r b{font:700 96px/1 var(--d);font-variant-numeric:tabular-nums}
#shine{position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);opacity:0}
#intro.go #shine{animation:shine 1.3s ease-out 1.4s 2}
@keyframes shine{0%{opacity:1;left:-30%}100%{opacity:0;left:120%}}
/* confetti */
.cf{position:absolute;width:12px;height:18px;border-radius:2px;opacity:0;animation:fall var(--dur,2.4s) linear var(--del,0s) forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
/* 2 · entry stubs */
#stubs{position:absolute;left:40px;bottom:46px;width:520px;display:flex;flex-direction:column-reverse;gap:10px}
.stub{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;height:74px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));animation:stubin .5s cubic-bezier(.2,1.5,.4,1) both}
.stub.out{animation:stubout .5s ease-in forwards}
@keyframes stubin{from{opacity:0;transform:translateX(-120%) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes stubout{to{opacity:0;transform:translateX(-40px)}}
.stub .ticket{height:74px;display:flex;align-items:center;justify-content:center;font:700 38px/1 var(--d);letter-spacing:.04em;font-variant-numeric:tabular-nums;border-radius:10px;--perf:200%}
.stub .n{height:74px;box-sizing:border-box;margin-left:-6px;padding:10px 18px 10px 22px;border-radius:0 12px 12px 0;background:linear-gradient(135deg,rgba(9,17,31,.92),rgba(14,28,46,.88));border:1px solid rgba(255,213,106,.35);border-left:0;min-width:0}
.stub .n b{display:block;font:700 28px/1.05 var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #0009}
.stub .n small{display:block;font:700 13px/1 var(--d);letter-spacing:.2em;color:var(--gold);margin-top:5px}
#closing{position:absolute;left:50%;top:60px;transform:translateX(-50%) scale(.8);padding:14px 34px 16px;text-align:center;opacity:0;transition:opacity .3s,transform .3s}
#closing.on{opacity:1;transform:translateX(-50%)}
#closing small{display:block;font:700 18px/1 var(--d);letter-spacing:.26em;color:var(--gold)}
#closing b{display:block;font:700 96px/1 var(--d);margin-top:4px;font-variant-numeric:tabular-nums}
#closing b.tick{animation:tick .9s ease-out}
@keyframes tick{0%{transform:scale(1.5);color:var(--gold)}100%{transform:none}}
/* 3 · the draw */
#draw{position:absolute;left:50%;top:180px;width:1100px;margin-left:-550px;padding:28px 40px 30px;text-align:center;opacity:0;transform:translateY(40px) scale(.94);transition:opacity .5s,transform .5s cubic-bezier(.2,1.2,.4,1)}
#draw.on{opacity:1;transform:none}
#draw small{font:700 22px/1 var(--d);letter-spacing:.3em;color:var(--gold)}
#draw h2{font:700 46px/1.1 var(--d);margin:8px 0 18px;letter-spacing:.03em}
#drum{display:flex;justify-content:center;gap:16px;margin-bottom:18px}
#drum .hash{font:700 150px/1 var(--d);color:var(--gold);margin-right:6px}
#drum i{display:block;width:150px;height:190px;border-radius:16px;font:700 170px/190px var(--d);font-style:normal;color:#1b1405;text-shadow:none;background:linear-gradient(180deg,#fff0bd,#ffd56a 45%,#e9ac2b);box-shadow:inset 0 -14px 24px rgba(120,70,0,.3),inset 0 14px 24px rgba(255,255,255,.5),0 12px 26px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;overflow:hidden}
#drum i.spin{filter:blur(1.6px);color:rgba(27,20,5,.75)}
#drum i.lock{animation:lock .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes lock{0%{transform:scale(1.25) translateY(-10px)}100%{transform:none}}
#winner{min-height:120px}
#winner b{display:block;font:700 96px/1 var(--d);letter-spacing:.02em;color:#fff;opacity:0;transform:scale(.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#winner span{display:block;font:700 30px/1 var(--d);letter-spacing:.14em;color:var(--gold);margin-top:8px;opacity:0}
#winner.show b{animation:burst .7s cubic-bezier(.2,1.6,.4,1) forwards}#winner.show span{animation:fadeup .5s .35s ease-out forwards}
@keyframes burst{to{opacity:1;transform:none}}@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sofar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;min-height:52px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:10px;border:1px solid rgba(255,213,106,.4);background:rgba(255,213,106,.08);font:700 24px/1 var(--d);animation:stubin .45s cubic-bezier(.2,1.5,.4,1) both}
.chip em{font-style:normal;background:linear-gradient(180deg,#ffe9a8,#f2bd3d);color:#1b1405;text-shadow:none;border-radius:6px;padding:5px 9px;font-variant-numeric:tabular-nums}
/* final board */
#board{position:absolute;left:50%;top:170px;width:1200px;margin-left:-600px;padding:30px 44px 34px;text-align:center;opacity:0;transform:scale(.92);transition:opacity .6s,transform .6s cubic-bezier(.2,1.2,.4,1)}
#board.on{opacity:1;transform:none}
#board small{font:700 22px/1 var(--d);letter-spacing:.3em;color:var(--gold)}
#board h2{font:700 84px/1 var(--d);margin:8px 0 22px;letter-spacing:.03em;color:var(--gold)}
#list{display:flex;flex-direction:column;gap:12px;align-items:center}
.win{display:grid;grid-template-columns:70px 190px minmax(0,1fr) auto;gap:18px;align-items:center;width:100%;box-sizing:border-box;padding:12px 22px 12px 16px;border-radius:14px;border:1px solid rgba(255,213,106,.4);background:linear-gradient(90deg,rgba(255,213,106,.14),rgba(8,15,24,.4) 70%);animation:stubin .5s cubic-bezier(.2,1.4,.4,1) both;text-align:left}
.win .p{font:700 44px/1 var(--d);color:var(--gold);text-align:center}
.win .ticket{height:62px;display:flex;align-items:center;justify-content:center;font:700 40px/1 var(--d);font-variant-numeric:tabular-nums;border-radius:10px;--perf:200%}
.win b{font:700 46px/1.05 var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win span{font:700 24px/1 var(--d);letter-spacing:.08em;color:var(--gold);white-space:nowrap}
#board p{margin:18px 0 0;font:600 22px/1.3 var(--t);color:#c5d3e1}
@media(prefers-reduced-motion:reduce){#intro.go{animation:none;opacity:1;transform:none}.cf{display:none}}
</style></head>
<body><div id="stage">
 <div id="fx"></div>
 <div id="intro"><div class="ticket"><div class="l"><small>VOYAGER</small><h1>RAFFLE</h1><p><span id="i-line">OPEN FOR 10 MINUTES</span> · TYPE <b>!raffle</b></p></div><div class="r"><i>WINNERS</i><b id="i-win">5</b><i id="i-prize">10 TICKETS EACH</i></div><span id="shine"></span></div></div>
 <div id="stubs"></div>
 <div class="glass" id="closing"><small>RAFFLE CLOSES IN</small><b id="cd">10</b></div>
 <div class="glass" id="draw"><small id="d-tag">WINNING TICKET 1 OF 5</small><h2 id="d-sub">And the winning ticket is…</h2>
  <div id="drum"><span class="hash">#</span><i>0</i><i>0</i><i>0</i><i>0</i></div>
  <div id="winner"><b id="w-name"></b><span id="w-prize"></span></div><div id="sofar"></div></div>
 <div class="glass" id="board"><small>VOYAGER RAFFLE</small><h2 id="b-title">WINNERS</h2><div id="list"></div><p id="b-note"></p></div>
</div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),preview=new URLSearchParams(location.search).has('preview');
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;};
let d=null,offset=0,id='',seq=0,introDone=false,queue=[],lastStub=0,cdShown=-1,revealIdx=-1,locked=[false,false,false,false],named=false,chips=0,boardFor='';
const COL=['#ffd56a','#a7d8ff','#7ff0b5','#ff8f9c','#ffffff'];
function confetti(x,y,n,spread){const fx=$('fx');for(let i=0;i<n;i++){const c=el('i','cf'),a=Math.random()*Math.PI*2,r=spread*(.35+Math.random());c.style.left=x+'px';c.style.top=y+'px';c.style.background=COL[i%COL.length];
    c.style.setProperty('--x',Math.round(Math.cos(a)*r)+'px');c.style.setProperty('--y',Math.round(Math.sin(a)*r*.7+spread*.6)+'px');c.style.setProperty('--r',Math.round((Math.random()-.5)*1400)+'deg');c.style.setProperty('--dur',(1.8+Math.random()*1.4)+'s');c.style.setProperty('--del',(Math.random()*.25)+'s');
    fx.append(c);setTimeout(()=>c.remove(),3800);}}
function reset(r){id=r.id;seq=0;introDone=false;queue=[];cdShown=-1;revealIdx=-1;chips=0;boardFor='';$('stubs').textContent='';$('sofar').textContent='';$('list').textContent='';for(const k of ['draw','board','closing'])$(k).classList.remove('on');$('intro').classList.remove('go');}
function stub(e){const s=el('div','stub'),t=el('div','ticket','#'+e.ticket),n=el('div','n');n.append(el('b','',e.name),el('small','','YOU ARE IN · TICKET '+e.seq));s.append(t,n);$('stubs').prepend(s);
  setTimeout(()=>{s.classList.add('out');setTimeout(()=>s.remove(),520);},4200);while($('stubs').children.length>4)$('stubs').lastChild.remove();}
function frame(){const now=Date.now()+offset,r=d&&d.raffle;
  if(r){if(r.id!==id)reset(r);
    const open=r.phase==='intro'||r.phase==='open',left=r.endsAt-now;
    // 1 · opening
    if(!introDone&&now-r.phaseAt<6000&&r.phase==='intro'){introDone=true;$('i-line').textContent='OPEN FOR '+r.minutes+' MINUTE'+(r.minutes===1?'':'S');$('i-win').textContent=String(r.want);$('i-prize').textContent=r.prize?r.prize+' TICKETS EACH':'TO BE DRAWN';
      const i=$('intro');i.classList.remove('go');void i.offsetWidth;i.classList.add('go');setTimeout(()=>confetti(960,420,90,620),650);}
    // 2 · new entries → stubs (a few a second at most)
    for(const e of [...r.recent].reverse())if(e.seq>seq){seq=e.seq;queue.push(e);}
    if(queue.length>12)queue=queue.slice(-12);
    if(open&&queue.length&&performance.now()-lastStub>(queue.length>4?260:650)){lastStub=performance.now();stub(queue.shift());}
    const cd=open&&left<=10500&&left>0?Math.ceil(left/1000):-1;$('closing').classList.toggle('on',cd>0);if(cd>0&&cd!==cdShown){cdShown=cd;const b=$('cd');b.textContent=String(cd);b.classList.remove('tick');void b.offsetWidth;b.classList.add('tick');}
    // 3 · the draw
    const dr=r.drawing;$('draw').classList.toggle('on',r.phase==='drawing');
    if(r.phase==='drawing'){if(open===false)$('stubs').textContent='';
      while(chips<r.winners.length&&chips<(dr?dr.index:r.winners.length)){const w=r.winners[chips++],c=el('div','chip');c.append(el('em','','#'+w.ticket),document.createTextNode(w.name));$('sofar').append(c);}
      if(dr){const t=now-dr.startedAt,digits=String(dr.ticket).padStart(4,'0').split(''),cells=[...document.querySelectorAll('#drum i')];
        if(dr.index!==revealIdx){revealIdx=dr.index;locked=[false,false,false,false];named=false;$('winner').classList.remove('show');$('w-name').textContent='';$('w-prize').textContent='';$('d-tag').textContent='WINNING TICKET '+(dr.index+1)+' OF '+r.total;$('d-sub').textContent='And the winning ticket is…';}
        cells.forEach((c,i)=>{const at=1700+i*620;if(t>=at){if(!locked[i]){locked[i]=true;c.classList.remove('spin');c.classList.remove('lock');void c.offsetWidth;c.classList.add('lock');c.textContent=digits[i];}}else{c.classList.add('spin');c.textContent=String(Math.floor(Math.random()*10));}});
        if(t>=4300&&!named){named=true;$('w-name').textContent=dr.name;$('w-prize').textContent=r.prize?'WINS '+r.prize+' GIVEAWAY TICKETS':'WINNER';$('d-sub').textContent='Ticket #'+dr.ticket;$('winner').classList.add('show');confetti(960,520,110,700);}}}
    // final board
    $('board').classList.toggle('on',r.phase==='result');
    if(r.phase==='result'&&boardFor!==r.id){boardFor=r.id;$('stubs').textContent='';const L=$('list');L.textContent='';$('b-title').textContent=r.winners.length?(r.winners.length===1?'WINNER':'WINNERS'):'NO ENTRIES';
      r.winners.forEach((w,i)=>{const row=el('div','win');row.style.animationDelay=(i*.18)+'s';row.append(el('span','p',String(i+1)),el('div','ticket','#'+w.ticket),el('b','',w.name),el('span','',r.prize?'+'+r.prize+' TICKETS':''));L.append(row);});
      $('b-note').textContent=r.winners.length?(r.prize?'Each winner gets '+r.prize+' tickets for the giveaway that is running. ':'')+r.count+' ticket'+(r.count===1?' was':'s were')+' in the draw.':'Nobody joined this time.';if(r.winners.length)setTimeout(()=>confetti(960,300,140,900),300);}
  }else if(id){id='';for(const k of ['draw','board','closing'])$(k).classList.remove('on');$('stubs').textContent='';$('intro').classList.remove('go');}
  requestAnimationFrame(frame);}
async function poll(){try{const n=await(await fetch('/api/raffle/overlay',{cache:'no-store'})).json();offset=n.serverAt-Date.now();d=n;}catch{}setTimeout(poll,500);}
// preview: a sample raffle on a loop (2 s opening, 12 s open, draw of three, board)
function sample(){const names=['NebulaKnight','AuroraFox','StarlingVex','QuasarJo','OrbitOtter','CometCass','LunaDrift','IonWren'],t0=Date.now(),ent=names.map((n,i)=>({name:n,platform:'twitch',ticket:1000+((i*2731+417)%9000),seq:i+1}));let n=0;
  const idv='pv'+t0;setInterval(()=>{const now=Date.now(),t=now-t0,open=7000,close=open+16000,R=7000,wn=[ent[2],ent[5],ent[0]];if(t>open&&n<ent.length&&t>open+n*1500)n++;
    const phase=t<open?'intro':t<close?'open':t<close+R*3?'drawing':'result',shown=phase==='result'?3:phase==='drawing'?Math.floor((t-close)/R):0;
    d={serverAt:now,raffle:{id:idv,phase,phaseAt:phase==='intro'?t0:t0+open,opensAt:t0+open,endsAt:t0+close,minutes:10,want:3,prize:10,count:n,recent:ent.slice(0,n).reverse(),revealAt:t0+close,revealMs:R,
      drawing:phase==='drawing'?{index:shown,...wn[shown],startedAt:t0+close+shown*R}:null,winners:wn.slice(0,shown),total:3}};if(t>close+R*3+14000)location.reload();},200);}
const fit=()=>{$('stage').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';};addEventListener('resize',fit);fit();
if(preview)sample();else poll();requestAnimationFrame(frame);})();
</script></body></html>
