<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyager Medals · OBS</title>
<link rel="stylesheet" href="brand/fonts.css">
<link rel="icon" href="brand/voyager.png" type="image/png">
<style>
:root{--font:'Rajdhani','Arial Narrow',Arial,sans-serif;--body:'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:#f4f7fb}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.toast{position:absolute;left:56px;bottom:90px;width:680px;height:164px;display:flex;align-items:center;gap:26px;padding:0 30px;
  clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,0) 40%),rgba(9,15,27,.86);opacity:0}
.right .toast{left:auto;right:56px}
.toast.in{animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}.toast.out{animation:out .6s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0;transform:translateX(-40px)}}
.right .toast.in{animation-name:inr}@keyframes inr{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.edge{position:absolute;inset:0;pointer-events:none;border:1.5px solid var(--accent);opacity:.65;clip-path:inherit}
.glow{position:absolute;left:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.28;filter:blur(18px)}
.medal{position:relative;flex:none;width:120px;height:120px;display:flex;align-items:center;justify-content:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--metal);filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.medal .in{width:100px;height:100px;display:flex;align-items:center;justify-content:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.2),rgba(255,255,255,0) 60%),#070b13}
.medal svg{width:52px;height:52px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast.in .medal{animation:pop .9s cubic-bezier(.2,1.4,.4,1) .15s both}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.flash{position:absolute;left:90px;top:82px;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,.4) 40%,transparent 70%);opacity:0}
.toast.in .flash{animation:flash 1.1s ease-out .45s}
@keyframes flash{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(9)}100%{opacity:0;transform:scale(15)}}
.sheen{position:absolute;top:0;bottom:0;width:140px;left:-180px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent)}
.toast.in .sheen{animation:sheen 1.4s ease-out .6s}@keyframes sheen{to{left:760px}}
.text{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.eb{font:700 14px/1 var(--font);letter-spacing:5px;color:var(--accent)}
.title{font:700 38px/1 var(--font);letter-spacing:1px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font:600 16px/1.2 var(--body);color:rgba(235,242,250,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{font:500 13px/1.2 var(--body);color:rgba(235,242,250,.66)}
</style></head>
<body>
<div id="stage"></div>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),stage=document.getElementById('stage');
if(q.get('side')==='right')stage.classList.add('right');
const GRADES=[
  ['linear-gradient(180deg,#fff0de 0%,#f0b47c 22%,#c9783c 46%,#5a2e10 50%,#8f5022 60%,#e2a065 82%,#ffe3c6 100%)','#e8a36a'],
  ['linear-gradient(180deg,#ffffff 0%,#f6f9fc 20%,#c8d2de 44%,#3a4552 50%,#7f8c9b 60%,#e2e9f1 82%,#ffffff 100%)','#e9f0f8'],
  ['linear-gradient(180deg,#fffbea 0%,#ffe48a 20%,#ffbf2e 44%,#6e4300 50%,#c08000 60%,#ffd25a 82%,#fff1b8 100%)','#ffc53d'],
  ['linear-gradient(180deg,#ffffff 0%,#d9fbff 16%,#8be8ff 34%,#c08bff 47%,#2a0f5c 50%,#7a3cf0 57%,#ff7ad9 70%,#ffe08a 86%,#ffffff 100%)','#c08bff']];
const SPECIAL=['linear-gradient(135deg,#d9fbff,#7ce1cb 40%,#14524a 50%,#3fbfa4 60%,#e8fff9)','#7ce1cb'];
const ICONS={watch:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M12 7v5l3 2',follow:'M4 6h16v15H4z M4 10h16 M8 3v5 M16 3v5',streak:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 2 3 1-2 1-4 1-7z',
  regular:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0',subs:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
  substreak:'M13 2L4 14h7l-1 8 9-12h-7z',gifter:'M4 10h16v11H4z M3 7h18v3H3z M12 7v14 M12 7c-2-4-6-3-5 0 M12 7c2-4 6-3 5 0',giftbomb:'M12 2c3 3 4 7 4 11l-4 4-4-4c0-4 1-8 4-11z M8 13l-3 3v3l3-2 M16 13l3 3v3l-3-2',
  power:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M12 7v10',goals:'M5 21V4 M5 4h12l-2 4 2 4H5',patron:'M3 8l4 4 5-7 5 7 4-4-2 11H5z',elder:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
  seasonpatron:'M7 4h10v5a5 5 0 0 1-10 0z M12 14v4 M8 21h8',versus:'M4 4l9 9 M4 4h4 M4 4v4 M20 4l-9 9 M20 4h-4 M20 4v4 M7 17l-3 3 M17 17l3 3',hotstreak:'M13 2L4 14h7l-1 8 9-12h-7z',
  slayer:'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M12 2v4 M12 18v4 M2 12h4 M18 12h4',torpedo:'M12 2c3 3 4 7 4 11l-4 4-4-4c0-4 1-8 4-11z',
  topgun:'M3 8l4 4 5-7 5 7 4-4-2 11H5z',points:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M12 7v10',missions:'M4 6h16v14H4z M8 12l3 3 5-6',spectrum:'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z',
  podium:'M7 4h10v5a5 5 0 0 1-10 0z M12 14v4 M8 21h8',champion:'M3 8l4 4 5-7 5 7 4-4-2 11H5z',lucky:'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z',
  founding:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',firstcontact:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z',laststand:'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M12 8v5 M12 16v.01',nightwatch:'M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z'};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')';}addEventListener('resize',fit);fit();
const seen=new Set(),queue=[];let busy=false,started=Date.now(),serverOffset=0,first=true;
function show(t){
  busy=true;const [metal,accent]=t.special?SPECIAL:GRADES[t.grade]||GRADES[0];
  const d=document.createElement('div');d.className='toast';d.style.setProperty('--metal',metal);d.style.setProperty('--accent',accent);
  const svg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(ICONS[t.medal]||ICONS.spectrum)+'"></path></svg>';
  d.innerHTML='<div class="glow"></div><div class="edge"></div><div class="medal"><div class="in">'+svg+'</div></div><div class="flash"></div><div class="sheen"></div><div class="text"><span class="eb"></span><span class="title"></span><span class="who"></span><span class="next"></span></div>';
  d.querySelector('.eb').textContent=t.special?'★ SPECIAL MEDAL ★':t.upgrade?'★ MEDAL UPGRADED · '+t.gradeName.toUpperCase()+' ★':'MEDAL UNLOCKED · '+t.gradeName.toUpperCase();
  d.querySelector('.title').textContent=t.title+(t.special?'':' '+['I','II','III','IV'][t.grade]);
  d.querySelector('.who').textContent=t.name+' · '+t.desc;d.querySelector('.next').textContent=t.next||'';
  stage.append(d);requestAnimationFrame(()=>d.classList.add('in'));
  setTimeout(()=>{d.classList.remove('in');d.classList.add('out');setTimeout(()=>{d.remove();busy=false;next();},650);},7000);
}
function next(){if(!busy&&queue.length)show(queue.shift());}
async function poll(){
  try{const r=await fetch('/api/medals/overlay',{cache:'no-store'});const d=await r.json();serverOffset=d.serverAt-Date.now();
    for(const t of d.toasts||[]){if(seen.has(t.id))continue;seen.add(t.id);
      // On first load, skip anything that happened before OBS opened the page.
      if(first&&t.at<started+serverOffset-5000)continue;queue.push(t);}
    first=false;next();
  }catch{}
  setTimeout(poll,1000);
}
poll();
})();
</script>
</body></html>
