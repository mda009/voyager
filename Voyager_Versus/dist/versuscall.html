.alert.playing{animation:arrival 12s both}
.masthead{display:flex;align-items:center;gap:calc(1.5 * var(--u));font-size:calc(1.3 * var(--u));letter-spacing:.24em;color:#a8c9e1;text-shadow:0 2px 5px #020915}
.masthead .signal{width:calc(.65 * var(--u));height:calc(.65 * var(--u));background:#a3e5ff;border-radius:50%;box-shadow:0 0 12px #73cfff}
.masthead .line{height:1px;width:calc(7 * var(--u));background:linear-gradient(90deg,#79caff,transparent)}
.masthead .brand{margin-left:auto;color:#e3edf7;font-size:calc(1.1 * var(--u));letter-spacing:.18em}
h1{margin:calc(1.1 * var(--u)) 0 0;min-height:1.12em;font-size:calc(4.7 * var(--u));font-weight:700;line-height:1.12;letter-spacing:.015em;text-shadow:0 2px 4px #000b,0 0 22px #0b285a66}
h1 span{color:#b7e9ff}
#ready-prefix{color:inherit}
.command-row{display:flex;align-items:center;gap:calc(3 * var(--u));margin-top:calc(.3 * var(--u))}
.command{min-width:calc(30 * var(--u));min-height:1em;white-space:nowrap;font-size:calc(10.5 * var(--u));line-height:1;letter-spacing:-.025em;color:#f3fbff;text-shadow:0 2px 6px #000b,0 0 25px #3b9aff66}
.command .bang{color:#82d7ff}
.caret{display:inline-block;width:.045em;height:.76em;margin-left:.09em;vertical-align:-.015em;background:#a0e3ff;box-shadow:0 0 10px #6dcfff;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.instruction{opacity:0}
.typed .instruction{opacity:1;transition:opacity .4s ease}
.instruction{padding-left:calc(2 * var(--u));border-left:1px solid #86cfff88;line-height:1.4;font-size:calc(1.5 * var(--u));letter-spacing:.1em;color:#bad2e8;text-shadow:0 2px 4px #000d}
.instruction strong{color:#fff;display:block;font-size:calc(1.9 * var(--u));letter-spacing:.06em}
.rule{position:absolute;left:0;bottom:calc(1.2 * var(--u));width:100%;height:1px;background:linear-gradient(90deg,#8cdbff,rgba(140,219,255,.35) 60%,transparent)}
.rule::before{content:'';position:absolute;left:0;top:-1px;width:30%;height:3px;background:linear-gradient(90deg,transparent,#c6f2ff,transparent);filter:drop-shadow(0 0 4px #62c4ff);opacity:0}
.playing .rule::before{animation:sweep 3.6s .5s 3 linear}
.footer{position:absolute;bottom:calc(-.5 * var(--u));font-size:calc(1.12 * var(--u));letter-spacing:.21em;color:#b1cadc;text-shadow:0 2px 4px #000d}
.footer.right{right:0;color:#83c9ed}
@keyframes arrival{0%{opacity:0;transform:translateX(-22px);filter:blur(5px)}7%{opacity:1;transform:translateX(0);filter:blur(0)}82%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(14px)}}
@keyframes sweep{0%{left:0;opacity:0}15%,75%{opacity:.8}100%{left:70%;opacity:0}}
.tools{position:fixed;right:12px;bottom:12px;z-index:10;width:min(550px,94vw);padding:14px 17px;background:#091725f2;border:1px solid #477692;border-radius:8px;font:14px/1.5 Arial,sans-serif;color:#c5d9eb;box-shadow:0 8px 30px #0008}
.tools strong{color:#fff}.tools p{margin:5px 0 9px}.tools button{font:inherit;color:#eaf7ff;background:#15324b;border:1px solid #5b91b7;border-radius:5px;padding:7px 12px;cursor:pointer;margin-right:6px}.tools code{color:#b6e7ff}
.preview-backdrop{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 35% 35%,#304b62,#101e2d 75%)}
@media(prefers-reduced-motion:reduce){.alert.playing{animation-name:quiet}.playing .rule::before{animation:none}@keyframes quiet{0%,100%{opacity:0}7%,82%{opacity:1}}}
</style>
</head>
<body>
<div id="backdrop" class="preview-backdrop" hidden></div>
<section id="alert" class="alert" aria-label="A Voyager Versus is Ready. Type !versus in Twitch chat.">
  <div class="masthead"><i class="signal"></i><span>INCOMING TRANSMISSION</span><i class="line"></i><span class="brand">MDA009 / VOYAGER</span></div>
  <h1 aria-label="A Voyager Versus is Ready"><span id="ready-prefix"></span><span id="ready-ending"></span><i id="title-caret" class="caret" aria-hidden="true" hidden></i></h1>
  <div class="command-row"><div class="command" aria-label="!versus"><span id="command-bang" class="bang"></span><span id="command-letters"></span><i id="command-caret" class="caret" aria-hidden="true" hidden></i></div><div class="instruction">TYPE IN TWITCH CHAT<strong>CALL FOR A CHALLENGER</strong></div></div>
  <div class="rule"></div><div class="footer">THE UNPROFESSIONALS</div><div class="footer right">50 VOYAGER POINTS FOR THE WIN</div>
</section>
<audio id="voice" src="Versus_AreYouReady.wav" preload="auto"></audio>
<aside id="tools" class="tools" hidden><strong>Voyager Versus · Ready alert</strong><p id="status" role="status">Connecting to Voyager…</p><button id="replay" type="button">Preview with audio</button><button id="arm" type="button">Enable audio</button><button id="hide" type="button">Hide controls</button><p>Live OBS URL: <code id="live-url"></code><br>Press D in OBS Interact to show or hide this card. Previews send no chat messages.</p></aside>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),preview=query.get('preview')==='1'||location.protocol==='file:',hosted=['127.0.0.1','localhost','[::1]'].includes(location.hostname),audio=$('voice'),visual=$('alert');
const volume=Number(query.get('volume')??1);audio.volume=Number.isFinite(volume)?Math.max(0,Math.min(1,volume)):1;
const storageKey='voyager-versus-ready-last-played-v1';let seen=null,active=null,activeTest=false,timer,source,sequence=0,audioIssue='',typingFrame;
try{seen=JSON.parse(localStorage.getItem(storageKey)||'null');}catch{}
function status(text){$('status').textContent=text+(audioIssue?' '+audioIssue:'');}
function hide(){visual.classList.remove('playing','typed');active=null;activeTest=false;clearTimeout(timer);cancelAnimationFrame(typingFrame);}
function stop(){sequence++;hide();audio.pause();audio.currentTime=0;}
function typeReveal(elapsed){
 const prefix='A Voyager Versus ',ending='is Ready',headline=prefix+ending,command='!versus';
 const start=performance.now()-elapsed,titleAt=700,titleStep=70,commandAt=titleAt+headline.length*titleStep+220,commandStep=85,doneAt=commandAt+command.length*commandStep;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function draw(){
   const t=reduced?Infinity:performance.now()-start;
   const a=Math.max(0,Math.min(headline.length,Math.floor((t-titleAt)/titleStep)+1));
   const b=Math.max(0,Math.min(command.length,Math.floor((t-commandAt)/commandStep)+1));
   $('ready-prefix').textContent=prefix.slice(0,a);$('ready-ending').textContent=ending.slice(0,Math.max(0,a-prefix.length));
   $('command-bang').textContent=b?'!':'';$('command-letters').textContent=command.slice(1,b||1);
   $('title-caret').hidden=reduced||t<titleAt||t>=commandAt;
   $('command-caret').hidden=reduced||t<commandAt||t>=doneAt+700;
   visual.classList.toggle('typed',t>=doneAt);
   if(t<doneAt+700)typingFrame=requestAnimationFrame(draw);
 }
 draw();
}
async function play(cue,elapsed=0){
 stop();const run=sequence;active=cue.id;activeTest=cue.test===true;
 visual.style.animationDuration=cue.durationMs+'ms';visual.classList.add('playing');
 for(const animation of visual.getAnimations({subtree:true}))animation.currentTime=elapsed;
 typeReveal(elapsed);
 timer=setTimeout(hide,Math.max(0,cue.durationMs-elapsed));
 audioIssue='';
 try{
   if(!Number.isFinite(audio.duration)||elapsed<audio.duration*1000){audio.currentTime=Math.max(0,elapsed/1000);await audio.play();}
 }catch(e){if(run!==sequence)return;audioIssue=e.name==='NotAllowedError'?'Audio blocked: use OBS Interact → Enable audio.':'Audio unavailable: check Versus_AreYouReady.wav is beside versuscall.html.';status('Visual cue received.');}
}
function previewNow(){status('Local preview · no chat message or game changes.');play({id:'preview-'+Date.now(),durationMs:12000,test:true});}
function consume(packet){
 const cue=packet.announcements?.readyAlert;
 status(packet.announcements?.readyAlert===undefined?'Host update required: copy the ready-alert update and restart Voyager.':packet.announcements.overlayMessage||packet.announcements.message||'Connected · waiting for a new ready announcement.');
 if(!cue){if(active&&!activeTest)stop();return;}
 if(typeof cue.id!=='string'||!Number.isFinite(cue.startedAt)||cue.durationMs!==12000||!Number.isFinite(packet.serverTime))return;
 const elapsed=packet.serverTime-cue.startedAt;
 // Accept the remaining live cue after a brief connection delay; never replay an expired cue.
 if(elapsed<0||elapsed>=cue.durationMs||Math.abs(Date.now()-packet.serverTime)>5000||seen?.id===cue.id||active===cue.id)return;
 seen={id:cue.id,at:cue.startedAt};try{localStorage.setItem(storageKey,JSON.stringify(seen));}catch{}
 play(cue,elapsed);
}
$('live-url').textContent=(hosted?location.origin:'http://127.0.0.1:8740')+'/versuscall.html';
$('replay').onclick=previewNow;
$('arm').onclick=async()=>{
 stop();try{audio.muted=true;await audio.play();audio.pause();audio.currentTime=0;audioIssue='';status('Audio enabled for the next announcement.');}catch{audioIssue='Audio could not start. Check the WAV file and OBS audio settings.';status('Audio check failed.');}finally{audio.muted=false;}
};
$('hide').onclick=()=>$('tools').hidden=true;
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='d')$('tools').hidden=!$('tools').hidden;});
if(preview){$('tools').hidden=false;$('backdrop').hidden=false;document.fonts.ready.then(previewNow);}
else if(hosted){
 source=new EventSource('/api/events');source.onmessage=e=>{try{consume(JSON.parse(e.data));}catch{status('Could not read the host update.');}};
 source.onerror=()=>status('Voyager host disconnected · reconnecting. Keep the launcher running.');
}else{$('tools').hidden=false;status('Open the live OBS URL above after starting Voyager.');}
addEventListener('pagehide',()=>{source?.close();stop();});
})();
</script>
</body>
</html>
